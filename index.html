<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FYP 協同作戰系統</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
        }

        body {
            margin: 0;
            background-color: #1a1a2e;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            text-align: center;
            padding: 20px;
        }

            .screen.active {
                display: flex;
            }

        h1 {
            font-size: 28px;
            color: #00ffff;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
            margin-bottom: 10px;
        }

        /* 等待與抽卡 UI */
        .loader {
            border: 6px solid #333;
            border-top: 6px solid #00ffff;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .card {
            background: linear-gradient(135deg, #443366, #221144);
            border: 2px solid #aa88ff;
            border-radius: 15px;
            padding: 20px;
            margin: 15px 0;
            width: 80%;
            max-width: 300px;
            box-shadow: 0 0 20px rgba(170, 136, 255, 0.4);
        }

        .monster-name {
            font-size: 32px;
            font-weight: bold;
            color: #fff;
            margin: 10px 0;
        }

        .btn-summon {
            background: #00cc66;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 24px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0, 204, 102, 0.4);
            transition: 0.1s;
        }

            .btn-summon:active {
                transform: scale(0.95);
            }

        /* 虛擬搖桿 UI */
        #joystick-area {
            display: none;
            margin-top: 30px;
            width: 200px;
            height: 200px;
            background: rgba(255,255,255,0.1);
            border-radius: 50%;
            position: relative;
            border: 2px solid rgba(0, 255, 255, 0.3);
        }

        #joystick-knob {
            width: 80px;
            height: 80px;
            background: radial-gradient(circle, #00ffff, #0088ff);
            border-radius: 50%;
            position: absolute;
            top: 60px;
            left: 60px;
            box-shadow: 0 0 15px #00ffff;
            pointer-events: none;
        }

        /* 封印 QTE 雙手連打 */
        #tapCount {
            font-size: 56px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #ff00ff;
            text-shadow: 0 0 15px #ff00ff;
        }

        .tap-container {
            display: flex;
            width: 90vw;
            height: 50vh;
            gap: 15px;
            margin-top: 10px;
        }

        .tap-zone {
            flex: 1;
            border-radius: 20px;
            background: rgba(255, 59, 48, 0.15);
            border: 4px solid #ff3b30;
            color: #fff;
            font-size: 28px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: inset 0 0 20px rgba(255, 59, 48, 0.5);
        }

            .tap-zone:active {
                background: rgba(255, 59, 48, 0.6);
                transform: scale(0.96);
            }

        .pulse {
            animation: pulseAnim 1s infinite alternate;
        }

        @keyframes pulseAnim {
            from {
                transform: scale(1);
            }

            to {
                transform: scale(1.05);
                color: #ff3333;
            }
        }
    </style>
</head>
<body>

    <div id="screen-waiting" class="screen active">
        <div class="loader"></div>
        <h1>等待主機開始遊戲...</h1>
    </div>

    <div id="screen-battle" class="screen">
        <h1 id="battle-title">⚔️ 戰鬥支援</h1>
        <div class="card" id="summon-card">
            <div style="font-size: 40px;" id="monster-icon">🐉</div>
            <div class="monster-name" id="monster-name">隨機怪獸</div>
        </div>
        <button id="btn-summon" class="btn-summon" onclick="summonMonster()">召喚並操控！</button>

        <!-- 召喚後顯示虛擬搖桿 -->
        <div id="joystick-area">
            <div id="joystick-knob"></div>
        </div>
    </div>

    <div id="screen-sealing-prep" class="screen">
        <h1 class="pulse">⚠️ 警告 ⚠️</h1>
        <h2>Boss 瀕死！準備封印！</h2>
    </div>

    <div id="screen-sealing" class="screen">
        <h1>緊急封印中！</h1>
        <div id="tapCount">0 下</div>
        <div class="tap-container">
            <div class="tap-zone" id="tapLeft">👈<br>左手</div>
            <div class="tap-zone" id="tapRight">👉<br>右手</div>
        </div>
    </div>

    <script>
        const FIREBASE_BASE_URL = "https://fyp-spirit-default-rtdb.firebaseio.com/coop_session";
        const userId = "user_" + Math.floor(Math.random() * 1000000);
        let currentState = "waiting";
        let hasSummoned = false;

        // 怪獸卡池 (名稱需與 Unity 中的配置名稱一致)
        const monsterPool = [
            { name: "烈焰龍", icon: "🐉" },
            { name: "水岩獸", icon: "🐢" },
            { name: "風雷鳥", icon: "🦅" }
        ];
        let myMonster = monsterPool[Math.floor(Math.random() * monsterPool.length)];

        document.getElementById("monster-name").innerText = myMonster.name;
        document.getElementById("monster-icon").innerText = myMonster.icon;

        setInterval(fetchGameState, 1000);

        function fetchGameState() {
            fetch(`${FIREBASE_BASE_URL}/state.json`)
                .then(res => res.json())
                .then(state => {
                    if (state) state = state.replace(/"/g, '');
                    if (state && state !== currentState) {
                        currentState = state;
                        switchScreen(currentState);
                    }
                }).catch(err => { });
        }

        function switchScreen(stateId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            const targetScreen = document.getElementById('screen-' + stateId.replace('_', '-')) || document.getElementById('screen-waiting');
            targetScreen.classList.add('active');
        }

        // --- 召喚功能 ---
        function summonMonster() {
            if (hasSummoned) return;
            hasSummoned = true;

            document.getElementById("btn-summon").style.display = "none";
            document.getElementById("summon-card").style.display = "none";
            document.getElementById("battle-title").innerText = "🕹️ 操控你的怪獸";
            document.getElementById("joystick-area").style.display = "block"; // 顯示搖桿

            const payload = {};
            payload[userId] = myMonster.name;
            fetch(`${FIREBASE_BASE_URL}/spawns.json`, { method: 'PATCH', body: JSON.stringify(payload) });
        }

        // --- 虛擬搖桿功能 ---
        const joyArea = document.getElementById("joystick-area");
        const joyKnob = document.getElementById("joystick-knob");
        let joyActive = false;
        let joyData = { x: 0, y: 0 };
        let lastSentData = { x: 0, y: 0 };

        joyArea.addEventListener("pointerdown", startJoy);
        joyArea.addEventListener("pointermove", moveJoy);
        window.addEventListener("pointerup", endJoy);

        function startJoy(e) { joyActive = true; moveJoy(e); }
        function endJoy(e) {
            joyActive = false;
            joyKnob.style.transform = `translate(0px, 0px)`;
            joyData = { x: 0, y: 0 };
            sendJoystickData(); // 歸零
        }
        function moveJoy(e) {
            if (!joyActive) return;
            const rect = joyArea.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            let dx = e.clientX - centerX;
            let dy = e.clientY - centerY;
            const maxRadius = 60;
            const distance = Math.sqrt(dx * dx + dy * dy);

            if (distance > maxRadius) {
                dx = (dx / distance) * maxRadius;
                dy = (dy / distance) * maxRadius;
            }

            joyKnob.style.transform = `translate(${dx}px, ${dy}px)`;

            // 轉換為 -1.0 到 1.0 之間
            joyData.x = (dx / maxRadius).toFixed(2);
            joyData.y = -(dy / maxRadius).toFixed(2); // 反轉 Y 軸適應 Unity
        }

        // 每 150 毫秒傳送一次搖桿數據 (避免過度請求 Firebase)
        setInterval(() => {
            if (hasSummoned && currentState === "battle") {
                if (joyData.x !== lastSentData.x || joyData.y !== lastSentData.y) {
                    sendJoystickData();
                    lastSentData.x = joyData.x;
                    lastSentData.y = joyData.y;
                }
            }
        }, 150);

        function sendJoystickData() {
            const payload = {};
            payload[userId] = `${joyData.x},${joyData.y}`;
            fetch(`${FIREBASE_BASE_URL}/joysticks.json`, { method: 'PATCH', body: JSON.stringify(payload) });
        }

        // --- 封印連打功能 ---
        let taps = 0;
        let isUploadingTaps = false;
        function registerTap() { taps++; document.getElementById("tapCount").innerText = taps + " 下"; }
        document.getElementById("tapLeft").addEventListener("pointerdown", registerTap);
        document.getElementById("tapRight").addEventListener("pointerdown", registerTap);

        setInterval(() => {
            if (currentState === "sealing" && taps > 0 && !isUploadingTaps) {
                isUploadingTaps = true;
                const payload = {};
                payload[userId] = taps;
                fetch(`${FIREBASE_BASE_URL}/taps.json`, { method: 'PATCH', body: JSON.stringify(payload) })
                    .then(() => isUploadingTaps = false).catch(() => isUploadingTaps = false);
            }
        }, 500);
    </script>
</body>
</html>
