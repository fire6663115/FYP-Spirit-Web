<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- 禁止瀏覽器快取，確保拿到最新版 -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>FYP 協同作戰系統</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            margin: 0;
            background-color: #1a1a2e;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            text-align: center;
            padding: 20px;
        }

            .screen.active {
                display: flex;
            }

        h1 {
            font-size: 28px;
            color: #00ffff;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
            margin-bottom: 10px;
        }

        p {
            margin-top: 0;
            color: #ccc;
        }

        .loader {
            border: 6px solid #333;
            border-top: 6px solid #00ffff;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .card {
            background: linear-gradient(135deg, #443366, #221144);
            border: 2px solid #aa88ff;
            border-radius: 15px;
            padding: 30px 20px;
            margin: 20px 0;
            width: 80%;
            max-width: 300px;
            box-shadow: 0 0 20px rgba(170, 136, 255, 0.4);
        }

        .monster-name {
            font-size: 32px;
            font-weight: bold;
            color: #fff;
            margin: 10px 0;
        }

        .btn-main {
            background: #00cc66;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 24px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0, 204, 102, 0.4);
            width: 80%;
        }

            .btn-main:active {
                transform: scale(0.95);
            }

        .control-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            width: 90vw;
            max-width: 400px;
            margin-top: 20px;
        }

        .cmd-btn {
            background: #2a2a4e;
            border: 2px solid #555588;
            color: white;
            border-radius: 15px;
            padding: 20px 10px;
            font-size: 20px;
            font-weight: bold;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.1s;
        }

            .cmd-btn.active-cmd {
                background: #443388;
                border-color: #aa88ff;
                box-shadow: 0 0 15px rgba(170, 136, 255, 0.6);
            }

            .cmd-btn:active {
                transform: scale(0.95);
                background: #5544aa;
            }

        .ult-btn {
            grid-column: span 2;
            background: linear-gradient(90deg, #ff3366, #cc0033);
            border: 2px solid #ff9999;
            box-shadow: 0 0 20px rgba(255, 51, 102, 0.5);
        }

            .ult-btn:active {
                background: #990000;
            }

        #tapCount {
            font-size: 56px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #ff00ff;
            text-shadow: 0 0 15px #ff00ff;
        }

        .tap-container {
            display: flex;
            width: 90vw;
            height: 40vh;
            gap: 15px;
            margin-top: 10px;
        }

        .tap-zone {
            flex: 1;
            border-radius: 20px;
            background: rgba(255, 59, 48, 0.15);
            border: 4px solid #ff3b30;
            color: #fff;
            font-size: 28px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            touch-action: manipulation;
        }

            .tap-zone:active {
                background: rgba(255, 59, 48, 0.6);
                transform: scale(0.96);
                box-shadow: inset 0 0 50px rgba(255, 59, 48, 0.9);
            }

        /* 增強版 Debug 面板 */
        #debug-panel {
            position: absolute;
            bottom: 5px;
            left: 5px;
            font-size: 11px;
            color: #0f0;
            background: rgba(0,0,0,0.8);
            padding: 5px;
            border-radius: 5px;
            max-width: 95vw;
            word-wrap: break-word;
            z-index: 999;
        }
    </style>
</head>
<body>
    <div id="debug-panel">系統啟動中...</div>

    <div id="screen-waiting" class="screen active">
        <div class="loader"></div>
        <h1>等待主機開始遊戲...</h1>
        <p>連線準備中</p>
    </div>

    <div id="screen-battle-summon" class="screen">
        <h1>⚔️ 戰鬥已開始！</h1>
        <p>你抽到的支援怪獸是：</p>
        <div class="card">
            <div style="font-size: 40px;" id="monster-icon">🔮</div>
            <div class="monster-name" id="monster-name">載入中...</div>
        </div>
        <button class="btn-main" id="summonBtn" onclick="summonMonster()">召喚支援！</button>
    </div>

    <div id="screen-battle-control" class="screen">
        <h1 style="color: #aa88ff;">📡 戰術控制台</h1>
        <div class="control-grid">
            <div class="cmd-btn active-cmd" id="cmd-Free" onclick="sendCommand('Free')">🐺 隨性索敵</div>
            <div class="cmd-btn" id="cmd-Standby" onclick="sendCommand('Standby')">🛡️ 原地待命</div>
            <div class="cmd-btn" id="cmd-AttackBoss" onclick="sendCommand('AttackBoss')">⚔️ 鎖定強攻</div>
            <div class="cmd-btn" id="cmd-Defend" onclick="sendCommand('Defend')">🏃 貼身回防</div>
            <div class="cmd-btn ult-btn" onclick="sendCommand('Ultimate')">🔥 釋放終極大招！</div>
        </div>
    </div>

    <div id="screen-sealing-prep" class="screen">
        <h1 style="color: #ff3333; animation: pulseAnim 1s infinite alternate;">⚠️ 警告 ⚠️</h1>
        <h2 style="color: #ffcc00;">Boss 瀕死！準備封印！</h2>
    </div>

    <div id="screen-sealing" class="screen">
        <h1>緊急封印中！</h1>
        <div id="tapCount">0 下</div>
        <div class="tap-container">
            <div class="tap-zone" id="tapLeft">👈 左手狂點</div>
            <div class="tap-zone" id="tapRight">右手狂點 👉</div>
        </div>
    </div>

    <script>
        const FIREBASE_BASE_URL = "https://fyp-spirit-default-rtdb.firebaseio.com/coop_session";
        const userId = "user_" + Math.floor(Math.random() * 10000);
        let currentState = "unknown";
        let hasSummoned = false;
        let myMonsterName = "神秘怪獸";
        let isPoolLoaded = false;

        const debugLog = document.getElementById("debug-panel");
        let fetchCount = 0;

        function log(msg, isError = false) {
            const color = isError ? '#ff4444' : '#00ff00';
            debugLog.innerHTML = `<span style="color:${color}">[${fetchCount}] ${msg}</span>`;
        }

        // 先執行一次，再設間隔
        fetchGameState();
        setInterval(fetchGameState, 1500);

        async function fetchGameState() {
            fetchCount++;
            try {
                // 1. 同步卡池 (加入 catch 防止單點崩潰)
                if (!isPoolLoaded) {
                    const poolRes = await fetch(`${FIREBASE_BASE_URL}/pool.json?t=${new Date().getTime()}`);
                    if (!poolRes.ok) throw new Error(`Pool HTTP: ${poolRes.status}`);
                    const poolData = await poolRes.json();

                    if (Array.isArray(poolData) && poolData.length > 0) {
                        myMonsterName = poolData[Math.floor(Math.random() * poolData.length)];
                        document.getElementById("monster-name").innerText = myMonsterName;
                        isPoolLoaded = true;
                    } else if (poolData !== null) {
                        log("卡池格式錯誤: " + JSON.stringify(poolData).substring(0, 20), true);
                    }
                }

                // 2. 同步狀態
                const stateRes = await fetch(`${FIREBASE_BASE_URL}/state.json?t=${new Date().getTime()}`);
                if (!stateRes.ok) throw new Error(`State HTTP: ${stateRes.status}`);
                const stateData = await stateRes.json();

                let cleanState = stateData ? String(stateData).replace(/"/g, '') : "waiting";
                log(`UID: ${userId} | 狀態: ${cleanState} | 卡池: ${isPoolLoaded}`);

                if (cleanState !== currentState) {
                    if (cleanState === "waiting") { hasSummoned = false; isPoolLoaded = false; }
                    currentState = cleanState;
                    updateScreen();
                }

            } catch (err) {
                log(`網路錯誤: ${err.message}`, true);
                console.error("Fetch Error:", err);
            }
        }

        function updateScreen() {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            if (currentState === "battle") {
                if (!hasSummoned) document.getElementById('screen-battle-summon').classList.add('active');
                else document.getElementById('screen-battle-control').classList.add('active');
            } else {
                const targetScreen = document.getElementById('screen-' + currentState.replace('_', '-')) || document.getElementById('screen-waiting');
                targetScreen.classList.add('active');
            }
        }

        async function summonMonster() {
            if (!isPoolLoaded) { alert("主機尚未上傳卡池，請確認 Unity 是否有報錯！"); return; }
            hasSummoned = true;
            try {
                const payload = {}; payload[userId] = myMonsterName;
                await fetch(`${FIREBASE_BASE_URL}/spawns.json`, {
                    method: 'PATCH',
                    body: JSON.stringify(payload)
                });
                sendCommand("Free");
                updateScreen();
            } catch (err) {
                log("召喚失敗", true);
            }
        }

        function sendCommand(cmdName) {
            document.querySelectorAll('.cmd-btn').forEach(btn => btn.classList.remove('active-cmd'));
            const activeBtn = document.getElementById('cmd-' + cmdName);
            if (activeBtn) activeBtn.classList.add('active-cmd');

            const payload = {}; payload[userId] = cmdName;
            fetch(`${FIREBASE_BASE_URL}/commands.json`, { method: 'PATCH', body: JSON.stringify(payload) }).catch(() => { });
        }

        let taps = 0;
        let isUploadingTaps = false;
        function registerTap() { taps++; document.getElementById("tapCount").innerText = taps + " 下"; }
        document.getElementById("tapLeft").addEventListener("pointerdown", registerTap);
        document.getElementById("tapRight").addEventListener("pointerdown", registerTap);

        setInterval(() => {
            if (currentState === "sealing" && taps > 0 && !isUploadingTaps) {
                isUploadingTaps = true;
                const payload = {}; payload[userId] = taps;
                fetch(`${FIREBASE_BASE_URL}/taps.json`, { method: 'PATCH', body: JSON.stringify(payload) })
                    .then(() => isUploadingTaps = false).catch(() => isUploadingTaps = false);
            }
        }, 500);
    </script>
</body>
</html>
