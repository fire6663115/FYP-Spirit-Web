<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>FYP 協同作戰系統</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            margin: 0;
            background-color: #1a1a2e;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            text-align: center;
            padding: 20px;
        }

            .screen.active {
                display: flex;
            }

        h1 {
            font-size: 28px;
            color: #00ffff;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
            margin-bottom: 10px;
        }

        p {
            margin-top: 0;
            color: #ccc;
            font-size: 18px;
        }

        .loader {
            border: 6px solid #333;
            border-top: 6px solid #00ffff;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .card {
            background: linear-gradient(135deg, #443366, #221144);
            border: 2px solid #aa88ff;
            border-radius: 15px;
            padding: 20px;
            margin: 20px 0;
            width: 80%;
            max-width: 300px;
            box-shadow: 0 0 20px rgba(170, 136, 255, 0.4);
        }

        .monster-name {
            font-size: 32px;
            font-weight: bold;
            color: #fff;
            margin: 10px 0;
        }

        /* 血量條 UI */
        .hp-container {
            width: 100%;
            background: #333;
            border-radius: 10px;
            margin-top: 10px;
            overflow: hidden;
            border: 2px solid #555;
        }

        .hp-bar {
            height: 15px;
            background: #00ff00;
            width: 100%;
            transition: width 0.3s, background 0.3s;
        }

        .hp-text {
            font-size: 14px;
            font-weight: bold;
            margin-top: 5px;
            color: #fff;
        }

        .btn-main {
            background: #00cc66;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 24px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0, 204, 102, 0.4);
            width: 80%;
        }

            .btn-main:active {
                transform: scale(0.95);
            }

        .control-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            width: 90vw;
            max-width: 400px;
            margin-top: 20px;
        }

        .cmd-btn {
            background: #2a2a4e;
            border: 2px solid #555588;
            color: white;
            border-radius: 15px;
            padding: 20px 10px;
            font-size: 20px;
            font-weight: bold;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.1s;
        }

            .cmd-btn.active-cmd {
                background: #443388;
                border-color: #aa88ff;
                box-shadow: 0 0 15px rgba(170, 136, 255, 0.6);
            }

            .cmd-btn:active {
                transform: scale(0.95);
                background: #5544aa;
            }

        .ult-btn {
            grid-column: span 1;
            background: linear-gradient(90deg, #ff3366, #cc0033);
            border: 2px solid #ff9999;
            box-shadow: 0 0 20px rgba(255, 51, 102, 0.5);
        }

        .recall-btn {
            grid-column: span 1;
            background: linear-gradient(90deg, #3366ff, #0033cc);
            border: 2px solid #99b3ff;
            box-shadow: 0 0 20px rgba(51, 102, 255, 0.5);
        }

        #tapCount {
            font-size: 56px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #ff00ff;
            text-shadow: 0 0 15px #ff00ff;
        }

        .tap-container {
            display: flex;
            width: 90vw;
            height: 40vh;
            gap: 15px;
            margin-top: 10px;
        }

        .tap-zone {
            flex: 1;
            border-radius: 20px;
            background: rgba(255, 59, 48, 0.15);
            border: 4px solid #ff3b30;
            color: #fff;
            font-size: 28px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
        }

            .tap-zone:active {
                background: rgba(255, 59, 48, 0.6);
                transform: scale(0.96);
                box-shadow: inset 0 0 50px rgba(255, 59, 48, 0.9);
            }
    </style>
</head>
<body>
    <div id="screen-waiting" class="screen active">
        <div class="loader"></div><h1>等待主機...</h1><p>等待主機進入關卡</p>
    </div>

    <!-- 轉場畫面 -->
    <div id="screen-moving" class="screen">
        <div class="loader" style="border-top-color: #ffcc00;"></div><h1 style="color:#ffcc00">🏃 區域淨空</h1>
        <p>本波次結束！請等待抵達下一戰區。</p>
    </div>

    <!-- 陣亡畫面 -->
    <div id="screen-dead" class="screen">
        <h1 style="color:#ff3333">💀 戰死沙場</h1><p>你的支援怪獸已徹底陣亡。<br>本局遊戲無法再進行召喚。</p>
    </div>

    <!-- 觀戰畫面 -->
    <div id="screen-spectator" class="screen">
        <h1 style="color:#aaaaaa">👁️ 觀戰模式</h1><p>連線房間已達上限！請在場外加油。</p>
    </div>

    <!-- 召回冷卻畫面 -->
    <div id="screen-cooldown" class="screen">
        <h1 style="color:#3366ff">🔙 召回休整中</h1>
        <div class="loader" style="border-top-color: #3366ff; width:70px; height:70px; margin: 30px auto;"></div>
        <p>怪獸正在重新凝聚靈力...</p>
        <h2 style="font-size: 40px; color: #fff;"><span id="cd-text">10</span> 秒後可再次喚靈</h2>
    </div>

    <div id="screen-battle-summon" class="screen">
        <h1>⚔️ 戰鬥已開始！</h1>
        <p>戰況緊急，請立即支援：</p>
        <div class="card">
            <div style="font-size: 40px;" id="monster-icon">🔮</div>
            <div class="monster-name" id="monster-name">載入中...</div>
            <div class="hp-container"><div class="hp-bar" id="summon-hp-bar"></div></div>
            <div class="hp-text">狀態: <span id="summon-hp-text">100</span>%</div>
        </div>
        <!-- 文字更改為「喚靈！」 -->
        <button class="btn-main" onclick="summonMonster()">喚靈！</button>
    </div>

    <div id="screen-battle-control" class="screen">
        <h1 style="color: #aa88ff;">📡 戰術控制台</h1>
        <div class="hp-container" style="width: 80%; max-width:300px;"><div class="hp-bar" id="ctrl-hp-bar"></div></div>
        <div class="hp-text" style="margin-bottom:15px;">實時血量: <span id="ctrl-hp-text">100</span>%</div>
        <div class="control-grid">
            <div class="cmd-btn active-cmd" id="cmd-Free" onclick="sendCommand('Free')">🐺 隨性索敵</div>
            <div class="cmd-btn" id="cmd-Standby" onclick="sendCommand('Standby')">🛡️ 原地待命</div>
            <div class="cmd-btn" id="cmd-AttackBoss" onclick="sendCommand('AttackBoss')">⚔️ 鎖定強攻</div>
            <div class="cmd-btn" id="cmd-Defend" onclick="sendCommand('Defend')">🏃 貼身回防</div>
            <div class="cmd-btn ult-btn" onclick="sendCommand('Ultimate')">🔥 大招</div>
            <!-- 新增召回按鈕 -->
            <div class="cmd-btn recall-btn" onclick="recallMonster()">🔙 召回</div>
        </div>
    </div>

    <div id="screen-sealing-prep" class="screen"><h1 style="color: #ff3333; animation: pulseAnim 1s infinite alternate;">⚠️ 警告 ⚠️</h1><h2 style="color: #ffcc00;">Boss 瀕死！準備封印！</h2></div>
    <div id="screen-sealing" class="screen"><h1>緊急封印中！</h1><div id="tapCount">0 下</div><div class="tap-container"><div class="tap-zone" id="tapLeft">👈 左手狂點</div><div class="tap-zone" id="tapRight">右手狂點 👉</div></div></div>

    <script>
        const FIREBASE_BASE_URL = "https://fyp-spirit-default-rtdb.firebaseio.com/coop_session";
        const userId = "user_" + Math.floor(Math.random() * 10000);
        let currentState = "unknown";
        let hasSummoned = false;
        let myMonsterName = "神秘怪獸";
        let isPoolLoaded = false;
        let currentHp = 100;
        let cooldownTimer = null;

        fetchGameState();
        setInterval(fetchGameState, 500);

        async function fetchGameState() {
            try {
                if (!isPoolLoaded) {
                    const poolRes = await fetch(`${FIREBASE_BASE_URL}/pool.json?t=${new Date().getTime()}`);
                    const poolData = await poolRes.json();
                    if (Array.isArray(poolData) && poolData.length > 0) {
                        myMonsterName = poolData[Math.floor(Math.random() * poolData.length)];
                        document.getElementById("monster-name").innerText = myMonsterName;
                        isPoolLoaded = true;
                    }
                }

                const specRes = await fetch(`${FIREBASE_BASE_URL}/spectators/${userId}.json?t=${new Date().getTime()}`);
                if (await specRes.json() === true) { currentState = "spectator"; updateScreen(); return; }

                const deadRes = await fetch(`${FIREBASE_BASE_URL}/dead_players/${userId}.json?t=${new Date().getTime()}`);
                if (await deadRes.json() === true) { currentState = "dead"; updateScreen(); return; }

                // 實時讀取血量 (Unity 現在會一直更新這個值)
                const hpRes = await fetch(`${FIREBASE_BASE_URL}/hp/${userId}.json?t=${new Date().getTime()}`);
                const hpData = await hpRes.json();
                if (hpData !== null) {
                    currentHp = parseFloat(hpData);
                    updateHpUI();
                }

                const stateRes = await fetch(`${FIREBASE_BASE_URL}/state.json?t=${new Date().getTime()}`);
                let cleanState = (await stateRes.json()) || "waiting";
                cleanState = String(cleanState).replace(/"/g, '');

                // 狀態切換邏輯
                if (cleanState !== currentState) {
                    if (cleanState === "waiting" || cleanState === "moving") {
                        hasSummoned = false;
                        if (cooldownTimer) clearInterval(cooldownTimer); // 打斷冷卻，直接進入下一波
                    }

                    // 只有當前不是在「召回冷卻中」，才允許被伺服器的戰鬥狀態覆蓋
                    if (!(currentState === "cooldown" && cleanState === "battle")) {
                        currentState = cleanState;
                    }
                    updateScreen();
                }
            } catch (err) { }
        }

        function updateHpUI() {
            document.getElementById("summon-hp-text").innerText = currentHp.toFixed(1);
            document.getElementById("ctrl-hp-text").innerText = currentHp.toFixed(1);
            const bars = [document.getElementById("summon-hp-bar"), document.getElementById("ctrl-hp-bar")];
            bars.forEach(bar => {
                bar.style.width = `${currentHp}%`;
                bar.style.background = currentHp > 50 ? "#00ff00" : (currentHp > 20 ? "#ffcc00" : "#ff3333");
            });
        }

        function updateScreen() {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            if (currentState === "battle") {
                if (!hasSummoned) document.getElementById('screen-battle-summon').classList.add('active');
                else document.getElementById('screen-battle-control').classList.add('active');
            } else {
                const targetScreen = document.getElementById('screen-' + currentState.replace('_', '-')) || document.getElementById('screen-waiting');
                targetScreen.classList.add('active');
            }
        }

        async function summonMonster() {
            if (!isPoolLoaded) return;
            hasSummoned = true;
            try {
                const payload = {}; payload[userId] = myMonsterName;
                await fetch(`${FIREBASE_BASE_URL}/spawns.json`, { method: 'PATCH', body: JSON.stringify(payload) });
                sendCommand("Free");
                updateScreen();
            } catch (err) { }
        }

        // 召回機制
        function recallMonster() {
            // 發送召回指令給 Unity
            const payload = {}; payload[userId] = "Recall";
            fetch(`${FIREBASE_BASE_URL}/commands.json`, { method: 'PATCH', body: JSON.stringify(payload) });

            // 進入 10 秒冷卻
            hasSummoned = false;
            currentState = "cooldown";
            updateScreen();

            let cdTime = 10;
            document.getElementById("cd-text").innerText = cdTime;
            cooldownTimer = setInterval(() => {
                cdTime--;
                document.getElementById("cd-text").innerText = cdTime;
                if (cdTime <= 0) {
                    clearInterval(cooldownTimer);
                    if (currentState === "cooldown") {
                        currentState = "battle";
                        updateScreen();
                    }
                }
            }, 1000);
        }

        function sendCommand(cmdName) {
            document.querySelectorAll('.cmd-btn').forEach(btn => btn.classList.remove('active-cmd'));
            const activeBtn = document.getElementById('cmd-' + cmdName);
            if (activeBtn) activeBtn.classList.add('active-cmd');

            const payload = {}; payload[userId] = cmdName;
            fetch(`${FIREBASE_BASE_URL}/commands.json`, { method: 'PATCH', body: JSON.stringify(payload) }).catch(() => { });
        }

        let taps = 0, isUploadingTaps = false;
        function registerTap() { taps++; document.getElementById("tapCount").innerText = taps + " 下"; }
        document.getElementById("tapLeft").addEventListener("pointerdown", registerTap);
        document.getElementById("tapRight").addEventListener("pointerdown", registerTap);

        setInterval(() => {
            if (currentState === "sealing" && taps > 0 && !isUploadingTaps) {
                isUploadingTaps = true;
                const payload = {}; payload[userId] = taps;
                fetch(`${FIREBASE_BASE_URL}/taps.json`, { method: 'PATCH', body: JSON.stringify(payload) })
                    .then(() => isUploadingTaps = false).catch(() => isUploadingTaps = false);
            }
        }, 500);
    </script>
</body>
</html>
