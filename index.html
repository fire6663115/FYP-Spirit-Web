<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>FYP 協同作戰系統</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            margin: 0;
            background-color: #1a1a2e;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
            flex-direction: row;
        }

        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            text-align: center;
            padding: 10px;
            position: relative;
        }

        .landscape-layout {
            display: flex;
            flex-direction: row;
            width: 100%;
            height: 100%;
            align-items: center;
            justify-content: space-evenly;
        }

        .screen.active {
            display: flex;
        }

        h1 {
            font-size: 26px;
            color: #00ffff;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
            margin: 5px 0;
        }

        p {
            margin-top: 5px;
            color: #ccc;
            font-size: 16px;
        }

        .loader {
            border: 6px solid #333;
            border-top: 6px solid #00ffff;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin-bottom: 10px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .left-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 45%;
        }

        .right-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 50%;
            position: relative;
        }

        .card {
            background: linear-gradient(135deg, #443366, #221144);
            border: 2px solid #aa88ff;
            border-radius: 15px;
            padding: 15px;
            margin: 10px 0;
            width: 100%;
            max-width: 250px;
            box-shadow: 0 0 15px rgba(170, 136, 255, 0.4);
        }

        .monster-name {
            font-size: 24px;
            font-weight: bold;
            color: #fff;
            margin: 5px 0;
        }

        .hp-container {
            width: 100%;
            background: #333;
            border-radius: 10px;
            margin-top: 5px;
            overflow: hidden;
            border: 2px solid #555;
        }

        .hp-bar {
            height: 12px;
            background: #00ff00;
            width: 100%;
            transition: width 0.3s, background 0.3s;
        }

        .hp-text {
            font-size: 13px;
            font-weight: bold;
            margin-top: 5px;
            color: #fff;
        }

        .btn-main {
            background: #00cc66;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 24px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0, 204, 102, 0.4);
            width: 90%;
            max-width: 250px;
        }

            .btn-main:active {
                transform: scale(0.95);
            }

        .control-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            width: 100%;
            max-width: 350px;
        }

        .cmd-btn {
            background: #2a2a4e;
            border: 2px solid #555588;
            color: white;
            border-radius: 12px;
            padding: 15px 5px;
            font-size: 16px;
            font-weight: bold;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.1s;
        }

            .cmd-btn.active-cmd {
                background: #443388;
                border-color: #aa88ff;
                box-shadow: 0 0 10px rgba(170, 136, 255, 0.6);
            }

            .cmd-btn:active {
                transform: scale(0.95);
                background: #5544aa;
            }

        .ult-btn {
            grid-column: span 2;
            background: linear-gradient(90deg, #ff3366, #cc0033);
            border: 2px solid #ff9999;
            box-shadow: 0 0 15px rgba(255, 51, 102, 0.5);
            font-size: 18px;
            padding: 10px;
        }

        .recall-fab {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 65px;
            height: 65px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3366ff, #0033cc);
            border: 2px solid #99b3ff;
            box-shadow: 0 0 15px rgba(51, 102, 255, 0.7);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 100;
            transition: transform 0.1s;
        }

            .recall-fab:active {
                transform: scale(0.9);
                background: #002299;
            }

        /* 封印畫面：完美的橫屏左右切割 */
        #screen-sealing {
            flex-direction: column;
        }

        .sealing-header {
            margin-bottom: 10px;
        }

        .tap-container {
            display: flex;
            flex-direction: row;
            width: 95vw;
            height: 65vh;
            gap: 20px;
        }

        .tap-zone {
            flex: 1;
            border-radius: 20px;
            background: rgba(255, 59, 48, 0.15);
            border: 4px solid #ff3b30;
            color: #fff;
            font-size: 28px;
            font-weight: bold;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
        }

            .tap-zone:active {
                background: rgba(255, 59, 48, 0.6);
                transform: scale(0.97);
                box-shadow: inset 0 0 30px rgba(255, 59, 48, 0.9);
            }
    </style>
</head>
<body>

    <div id="screen-waiting" class="screen active"><div class="loader"></div><h1>等待主機...</h1><p>等待主機進入關卡</p></div>
    <div id="screen-moving" class="screen"><div class="loader" style="border-top-color: #ffcc00;"></div><h1 style="color:#ffcc00">🏃 區域淨空</h1><p>本波次結束！請等待抵達下一戰區。</p></div>
    <div id="screen-dead" class="screen"><h1 style="color:#ff3333">💀 戰死沙場</h1><p>你的支援怪獸已徹底陣亡。<br>等待可協助封靈階段。</p></div>
    <div id="screen-spectator" class="screen"><h1 style="color:#aaaaaa">👁️ 觀戰模式</h1><p>連線房間已達上限！請在場外加油。</p></div>

    <div id="screen-cooldown" class="screen">
        <h1 style="color:#3366ff">🔙 召回休整中</h1>
        <div class="loader" style="border-top-color: #3366ff; width:60px; height:60px; margin: 15px auto;"></div>
        <h2 style="font-size: 32px; color: #fff; margin:0;"><span id="cd-text">10</span> 秒後可再次喚靈</h2>
    </div>

    <div id="screen-battle-summon" class="screen">
        <div class="landscape-layout">
            <div class="left-panel">
                <div class="card">
                    <div style="font-size: 30px;" id="monster-icon">🔮</div>
                    <div class="monster-name" id="monster-name">載入中...</div>
                    <div class="hp-container"><div class="hp-bar" id="summon-hp-bar"></div></div>
                    <div class="hp-text">狀態: <span id="summon-hp-text">100</span>%</div>
                </div>
            </div>
            <div class="right-panel">
                <h1>⚔️ 戰鬥已開始！</h1>
                <p>戰況緊急，請立即支援：</p>
                <button class="btn-main" onclick="summonMonster()">喚靈！</button>
            </div>
        </div>
    </div>

    <div id="screen-battle-control" class="screen">
        <div class="landscape-layout">
            <div class="left-panel">
                <div class="card" style="margin:0;">
                    <h1 style="color: #aa88ff; font-size:22px; margin:0;">📡 戰術控制</h1>
                    <div class="monster-name" id="ctrl-monster-name" style="font-size: 20px;">神秘怪獸</div>
                    <div class="hp-container"><div class="hp-bar" id="ctrl-hp-bar"></div></div>
                    <div class="hp-text">實時血量: <span id="ctrl-hp-text">100</span>%</div>
                </div>
            </div>
            <div class="right-panel">
                <div class="control-grid">
                    <div class="cmd-btn active-cmd" id="cmd-Free" onclick="sendCommand('Free')">🐺 隨性索敵</div>
                    <div class="cmd-btn" id="cmd-Standby" onclick="sendCommand('Standby')">🛡️ 原地待命</div>
                    <div class="cmd-btn" id="cmd-AttackBoss" onclick="sendCommand('AttackBoss')">⚔️ 鎖定強攻</div>
                    <div class="cmd-btn" id="cmd-Defend" onclick="sendCommand('Defend')">🏃 貼身回防</div>
                    <div class="cmd-btn ult-btn" onclick="sendCommand('Ultimate')">🔥 大招</div>
                </div>
                <div class="recall-fab" onclick="recallMonster()"><div style="font-size: 20px;">🔙</div><div style="font-size: 12px; font-weight: bold;">召回</div></div>
            </div>
        </div>
    </div>

    <div id="screen-sealing-prep" class="screen"><h1 style="color: #ff3333; animation: pulseAnim 1s infinite alternate;">⚠️ 警告 ⚠️</h1><h2 style="color: #ffcc00;">Boss 瀕死！準備封印！</h2></div>

    <!-- 橫向版封印畫面 -->
    <div id="screen-sealing" class="screen">
        <div class="sealing-header">
            <h1 style="margin:0;">緊急封印中！</h1>
            <div id="tapCount" style="margin: 0; font-size: 32px; color: #ff00ff;">0 下</div>
        </div>
        <div class="tap-container">
            <div class="tap-zone" id="tapLeft">👈 左手狂點</div>
            <div class="tap-zone" id="tapRight">右手狂點 👉</div>
        </div>
    </div>

    <script>
        const FIREBASE_BASE_URL = "https://fyp-spirit-default-rtdb.firebaseio.com/coop_session";

        // 【重要修復】刷新防呆：使用 LocalStorage 記住玩家身分
        let userId = localStorage.getItem("coop_userId");
        if (!userId) {
            userId = "user_" + Math.floor(Math.random() * 100000);
            localStorage.setItem("coop_userId", userId);
        }

        let currentState = "unknown";
        let hasSummoned = false;
        let myMonsterName = "神秘怪獸";
        let isPoolLoaded = false;
        let currentHp = 100;
        let cooldownTimer = null;
        let taps = 0, isUploadingTaps = false;

        // 開局時檢查雲端是否有我的召喚紀錄 (解決刷新頁面判定失效)
        checkIfAlreadySummoned();
        fetchGameState();
        setInterval(fetchGameState, 500);

        async function checkIfAlreadySummoned() {
            try {
                const res = await fetch(`${FIREBASE_BASE_URL}/spawns/${userId}.json?t=${new Date().getTime()}`);
                const data = await res.json();
                if (data !== null) { hasSummoned = true; } // 雲端有紀錄，代表已召喚，跳過喚靈按鈕
            } catch (err) { }
        }

        async function fetchGameState() {
            try {
                if (!isPoolLoaded) {
                    const poolRes = await fetch(`${FIREBASE_BASE_URL}/pool.json?t=${new Date().getTime()}`);
                    const poolData = await poolRes.json();
                    if (Array.isArray(poolData) && poolData.length > 0) {
                        myMonsterName = poolData[Math.floor(Math.random() * poolData.length)];
                        document.getElementById("monster-name").innerText = myMonsterName;
                        document.getElementById("ctrl-monster-name").innerText = myMonsterName;
                        isPoolLoaded = true;
                    }
                }

                const specRes = await fetch(`${FIREBASE_BASE_URL}/spectators/${userId}.json?t=${new Date().getTime()}`);
                if (await specRes.json() === true) { currentState = "spectator"; updateScreen(); return; }

                const deadRes = await fetch(`${FIREBASE_BASE_URL}/dead_players/${userId}.json?t=${new Date().getTime()}`);
                if (await deadRes.json() === true) { currentState = "dead"; updateScreen(); return; }

                const hpRes = await fetch(`${FIREBASE_BASE_URL}/hp/${userId}.json?t=${new Date().getTime()}`);
                const hpData = await hpRes.json();
                if (hpData !== null) { currentHp = parseFloat(hpData); updateHpUI(); }

                const stateRes = await fetch(`${FIREBASE_BASE_URL}/state.json?t=${new Date().getTime()}`);
                let cleanState = (await stateRes.json()) || "waiting";
                cleanState = String(cleanState).replace(/"/g, '');

                if (cleanState !== currentState) {
                    if (cleanState === "waiting" || cleanState === "moving") {
                        hasSummoned = false;
                        if (cooldownTimer) clearInterval(cooldownTimer);
                    }
                    if (cleanState === "sealing_prep" || cleanState === "waiting") {
                        taps = 0; document.getElementById("tapCount").innerText = "0 下";
                    }
                    if (!(currentState === "cooldown" && cleanState === "battle")) {
                        currentState = cleanState;
                    }
                    updateScreen();
                }
            } catch (err) { }
        }

        function updateHpUI() {
            document.getElementById("summon-hp-text").innerText = currentHp.toFixed(1);
            document.getElementById("ctrl-hp-text").innerText = currentHp.toFixed(1);
            const bars = [document.getElementById("summon-hp-bar"), document.getElementById("ctrl-hp-bar")];
            bars.forEach(bar => { bar.style.width = `${currentHp}%`; bar.style.background = currentHp > 50 ? "#00ff00" : (currentHp > 20 ? "#ffcc00" : "#ff3333"); });
        }

        function updateScreen() {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            if (currentState === "battle") {
                if (!hasSummoned) document.getElementById('screen-battle-summon').classList.add('active');
                else document.getElementById('screen-battle-control').classList.add('active');
            } else {
                const targetScreen = document.getElementById('screen-' + currentState.replace('_', '-')) || document.getElementById('screen-waiting');
                targetScreen.classList.add('active');
            }
        }

        async function summonMonster() {
            if (!isPoolLoaded) return;
            hasSummoned = true;
            try {
                const payload = {}; payload[userId] = myMonsterName;
                await fetch(`${FIREBASE_BASE_URL}/spawns.json`, { method: 'PATCH', body: JSON.stringify(payload) });
                sendCommand("Free");
                updateScreen();
            } catch (err) { }
        }

        function recallMonster() {
            const payload = {}; payload[userId] = "Recall";
            fetch(`${FIREBASE_BASE_URL}/commands.json`, { method: 'PATCH', body: JSON.stringify(payload) });
            fetch(`${FIREBASE_BASE_URL}/spawns/${userId}.json`, { method: 'DELETE' });

            hasSummoned = false; currentState = "cooldown"; updateScreen();
            let cdTime = 10; document.getElementById("cd-text").innerText = cdTime;
            cooldownTimer = setInterval(() => {
                cdTime--; document.getElementById("cd-text").innerText = cdTime;
                if (cdTime <= 0) {
                    clearInterval(cooldownTimer);
                    if (currentState === "cooldown") { currentState = "battle"; updateScreen(); }
                }
            }, 1000);
        }

        function sendCommand(cmdName) {
            document.querySelectorAll('.cmd-btn').forEach(btn => btn.classList.remove('active-cmd'));
            const activeBtn = document.getElementById('cmd-' + cmdName);
            if (activeBtn) activeBtn.classList.add('active-cmd');
            const payload = {}; payload[userId] = cmdName;
            fetch(`${FIREBASE_BASE_URL}/commands.json`, { method: 'PATCH', body: JSON.stringify(payload) }).catch(() => { });
        }

        function registerTap() { taps++; document.getElementById("tapCount").innerText = taps + " 下"; }
        document.getElementById("tapLeft").addEventListener("pointerdown", registerTap);
        document.getElementById("tapRight").addEventListener("pointerdown", registerTap);

        setInterval(() => {
            if (currentState === "sealing" && taps > 0 && !isUploadingTaps) {
                isUploadingTaps = true;
                const payload = {}; payload[userId] = taps;
                fetch(`${FIREBASE_BASE_URL}/taps.json`, { method: 'PATCH', body: JSON.stringify(payload) })
                    .then(() => isUploadingTaps = false).catch(() => isUploadingTaps = false);
            }
        }, 500);
    </script>
</body>
</html>
